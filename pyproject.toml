[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "adjustments-agent"
version = "0.1.0"
description = "Validate, quarantine, explain and post manual journal entries"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
llm = ["anthropic"]
dev = ["pytest"]

[project.scripts]
adjustments-agent = "adjustments_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
